name: CI golang workflow
on:
  pull_request:
    branches:
      - develop
jobs:
  check-application:
    name: check-application
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     go: [1.22, 1.23]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up golang
        uses: actions/setup-go@v6
        with:
          go-version: 1.22
      - name: Executando testes e rodando a aplicacao
        run: |
          go test
          go run math.go